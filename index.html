<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gummadi vaari pelli ahvanam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon-dark: #3a0d1e;
    --maroon: #5c1230;
    --gold: #d9b45c;
    --gold-light: #f3dfa8;
    --cream: #fbf2df;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #6e1938, #2a0a17 75%);
    font-family: 'Cormorant Garamond', serif;
    padding: 24px;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .card {
    position: relative;
    width: min(90vw, 640px);
    height: min(65vw, 460px);
    perspective: 1800px;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.55));
  }

  .interior {
    position: absolute;
    inset: 0;
    display: flex;
    border-radius: 18px;
    overflow: hidden;
    border: 3px solid var(--gold);
    background: var(--cream);
  }

  .section {
    flex: 1 1 0;
    height: 100%;
  }

  .section + .section {
    border-left: 1px dashed rgba(58, 13, 30, 0.25);
  }

  .section:nth-child(2) {
    background: rgba(217, 180, 92, 0.08);
  }

  .door {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(0.68, -0.2, 0.27, 1.1);
    z-index: 10;
  }

  .door-left { left: 0; transform-origin: left center; }
  .door-right { right: 0; transform-origin: right center; }

  .door-face {
    position: absolute;
    inset: 0;
    border: 3px solid var(--gold);
    overflow: hidden;
    backface-visibility: hidden;
  }

  .door-left .door-face { border-radius: 18px 0 0 18px; }
  .door-right .door-face { border-radius: 0 18px 18px 0; }

  .door-face-back {
    transform: rotateY(180deg);
    background: var(--cream);
    box-shadow: inset 0 0 0 6px rgba(217, 180, 92, 0.18);
  }

  .door-left .door-face-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .door-right .door-face-front {
    background:
      repeating-linear-gradient(45deg, rgba(217, 180, 92, 0.12) 0 10px, transparent 10px 20px),
      linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    text-align: center;
  }

  .telugu-title {
    font-family: 'Noto Sans Telugu', serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 3vw, 1.7rem);
    color: var(--gold-light);
    margin: 0;
    line-height: 1.5;
  }

  .to-line {
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    color: var(--cream);
    margin: 0;
  }

  .guest-name {
    font-weight: 600;
    color: var(--gold-light);
    border-bottom: 1px solid var(--gold-light);
    padding: 0 6px 2px;
  }

  .card.open .door-left { transform: rotateY(-112deg); }
  .card.open .door-right { transform: rotateY(112deg); }

  .knob {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid var(--maroon-dark);
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 70%);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    animation: pulse 2.2s ease-in-out infinite;
    transition: filter 0.2s ease;
  }

  .knob:hover { filter: brightness(1.08); }

  .knob.active {
    animation: none;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 0 rgba(217, 180, 92, 0.5); }
    50% { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 10px rgba(217, 180, 92, 0); }
  }

  .hint {
    color: var(--gold-light);
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card">
      <div class="interior">
        <div class="section"></div>
        <div class="section"></div>
        <div class="section"></div>
      </div>

      <div class="door door-left">
        <div class="door-face door-face-front">
          <img src="images.jpeg" alt="Wedding couple illustration">
        </div>
        <div class="door-face door-face-back"></div>
      </div>
      <div class="door door-right">
        <div class="door-face door-face-front">
          <p class="telugu-title">గుమ్మడి వారి పెళ్ళి ఆహ్వానం</p>
          <p class="to-line">To respected: <span id="guestName" class="guest-name">___________</span></p>
        </div>
        <div class="door-face door-face-back"></div>
      </div>
    </div>

    <button class="knob" id="openBtn" aria-label="Open the invitation"></button>

    <p class="hint">Tap the gold circle to open or close</p>
  </div>

<script>
  const card = document.getElementById('card');
  const openBtn = document.getElementById('openBtn');
  const guestName = document.getElementById('guestName');

  openBtn.addEventListener('click', () => {
    const isOpen = card.classList.toggle('open');
    openBtn.classList.toggle('active', isOpen);
  });

  function applyGuestNameFromUrl() {
    const requestedName = new URLSearchParams(window.location.search).get('name');
    if (requestedName) guestName.textContent = requestedName.trim();
  }

  applyGuestNameFromUrl();
</script>
</body>
</html>
